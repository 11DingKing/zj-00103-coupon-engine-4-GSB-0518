services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: coupon-engine:latest
    container_name: coupon-engine
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
